[pytest]
testpaths = tests

# `-p no:cacheprovider` keeps the suite from leaving a .pytest_cache directory in
# the repo; `-ra` prints a summary of every non-passing outcome, which is the
# point of a suite whose red tests are the deliverable.
addopts = -ra -p no:cacheprovider

markers =
    security_gap: expected to FAIL until the security remediation lands (a red test here is the evidence)
    broken_today: fails today for a non-security reason (contract bug found while writing this suite)
    regression: must pass both before and after the remediation (the front-end/compatibility guard)

# backend/test_login.py and backend/test_load.py talk to a live server on import
# and must never be collected. testpaths above keeps collection inside tests/.
norecursedirs = venv __pycache__
