<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Clock in or out — Site Attendance</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 18px 16px 10px; display: flex; gap: 12px; align-items: flex-start; }
  header .head { flex: 1; min-width: 0; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: .85rem; margin: 0; }
  main { flex: 1; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; }
  video, canvas, img.preview { width: 100%; border-radius: 12px; background: #0b1220; display: block; }
  img.preview { aspect-ratio: 3/4; object-fit: cover; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-height: 56px; border: 0; border-radius: 12px; font-size: 1.05rem;
    font-weight: 700; color: #0b1220; background: #38bdf8; cursor: pointer;
  }
  button.secondary { background: #334155; color: #e2e8f0; }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  /* The language picker: three letters at the top of the page, sized like a control and
     not like the one thing the page is for. */
  .langs { display: flex; gap: 4px; flex: 0 0 auto; }
  .langs button {
    flex: 0 0 auto; min-height: 30px; min-width: 32px; padding: 0 7px; border-radius: 999px;
    background: #334155; color: #cbd5e1; font-size: .75rem; font-weight: 700; line-height: 1;
  }
  .langs button[aria-pressed="true"] { background: #38bdf8; color: #0b1220; }
  input[type=file] { display: none; }
  label.file {
    display: block; text-align: center; padding: 14px; border: 1px dashed #475569;
    border-radius: 12px; color: #cbd5e1; cursor: pointer; margin-top: 12px;
  }
  .note { font-size: .8rem; color: #94a3b8; }
  .note.warn { color: #fca5a5; }
  .msg { border-radius: 12px; padding: 12px; font-weight: 600; display: none; }
  .msg.ok { display: block; background: #052e1a; color: #86efac; border: 1px solid #166534; }
  .msg.err { display: block; background: #3b0d0d; color: #fca5a5; border: 1px solid #7f1d1d; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #0b1220; color: #7dd3fc; font-size: .75rem; }
  .hidden { display: none !important; }
  .state { font-size: 1.05rem; font-weight: 700; }
  /* The vendor credit closes every page this app serves, this one included. "Thank you
     for using the app" would have been the other candidate and is a lie: a worker tapped
     a link somebody sent them. */
  .credit { margin: 0; padding: 0 16px 18px; text-align: center; font-size: .78rem; color: #64748b; }
</style>
</head>
<body>
<!--
  Every sentence below is English in the file and is re-read by ``capture.js`` into the
  reader's language at boot, off the ``data-t`` keys. Keeping the English here rather than
  building the page in JavaScript is deliberate: a script that never arrives leaves a page
  that reads as English, not one that reads as a list of key names - which is the failure
  these two pages already shipped once.
-->
<header>
  <div class="head">
    <h1 id="title" data-t="quick.title">Clock in or out</h1>
    <p class="sub" id="who" data-t="quick.sub">Checking this link…</p>
  </div>
  <nav class="langs" id="langs" data-t-aria="language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ar">ع</button>
    <button type="button" data-lang="hi">हि</button>
  </nav>
</header>

<main>
  <div id="message" class="msg"></div>

  <!--
    One button, not two. Whether this tap is a clock-in or a clock-out is a fact about the
    worker's shift, which the server knows and this page only reads - so the button says what
    is about to happen instead of asking the worker to remember.
  -->
  <div class="card">
    <p class="state" id="state">—</p>
    <p class="note" id="state-detail"></p>
    <div class="row" style="margin-top:12px">
      <button id="btn-punch" data-t="quick.btn.in">Clock in</button>
      <button id="btn-start" class="secondary" data-t="camera.open"
              data-t-title="quick.fallback">Open camera</button>
    </div>
    <p class="note" id="location-line" data-t="location.checking">Checking your location…</p>
  </div>

  <div class="card">
    <video id="video" playsinline autoplay muted class="hidden"></video>
    <img id="preview" class="preview hidden" data-t-alt="camera.preview.selfie" alt="Your selfie preview" />
    <canvas id="canvas" class="hidden"></canvas>
    <div class="row" style="margin-top:12px">
      <button id="btn-shoot" class="secondary hidden" data-t="camera.shoot.selfie">Take the selfie</button>
      <button id="btn-retake" class="secondary hidden" data-t="camera.retake">Retake</button>
    </div>
    <!--
      The sentence is in a span of its own, and not on the label: the translation replaces
      an element's text, and replacing the label's would take the file input inside it with
      it - a page whose only way out of a refused camera had silently disappeared.
    -->
    <label class="file" id="fallback-label">
      <span data-t="quick.fallback">Camera not available? Tap here to use the phone's camera app instead</span>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" capture="user" />
    </label>
    <p class="note" id="photo-policy"></p>
    <p class="note warn hidden" id="photo-problem"></p>
  </div>

  <p class="note" data-t="quick.note">
    Your administrator issued this link for you. It clocks you in and out without a password,
    and every tap is recorded with the selfie it was taken with.
  </p>
</main>

<footer class="credit" id="credit">Powered by دوامك اسهل</footer>

<!--
  Two scripts, and neither of them is named after this page.

  ``../capture.js`` is the half both link pages share - the camera, the photo policy, the
  location fix and the strings - and ``../quick.js`` is this page's own flow. The ``../``
  is not tidiness: this page is served at ``/q/<token>``, one segment deep, and that
  segment is a token rather than a directory. A bare ``src="quick.js"`` therefore resolves
  to ``/q/quick.js``, which the token route matches and answers with this very page; the
  browser refuses it (a script whose response is ``text/html`` is not executed under strict
  MIME checking), so none of either file ever ran and the two placeholders the page ships
  with - "Checking this link…" and "Checking your location…" - were the entire screen for
  whoever was sent it. One level up is the right file in both worlds this frontend lives
  in: the app's own static mount, and the frontend folder hosted on its own.
-->
<script src="../capture.js"></script>
<script src="../quick.js"></script>
</body>
</html>
