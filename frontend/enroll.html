<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>Register your face — Site Attendance</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 18px 16px 10px; display: flex; gap: 12px; align-items: flex-start; }
  header .head { flex: 1; min-width: 0; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { color: #94a3b8; font-size: .85rem; margin: 0; }
  main { flex: 1; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 14px; }
  video, canvas, img.preview { width: 100%; border-radius: 12px; background: #0b1220; display: block; }
  img.preview { aspect-ratio: 3/4; object-fit: cover; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-height: 52px; border: 0; border-radius: 12px; font-size: 1rem;
    font-weight: 600; color: #0b1220; background: #38bdf8; cursor: pointer;
  }
  button.secondary { background: #334155; color: #e2e8f0; }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  /* The language picker, as on the punch page: sized like a control, not like the one
     thing the page is for. */
  .langs { display: flex; gap: 4px; flex: 0 0 auto; }
  .langs button {
    flex: 0 0 auto; min-height: 30px; min-width: 32px; padding: 0 7px; border-radius: 999px;
    background: #334155; color: #cbd5e1; font-size: .75rem; font-weight: 700; line-height: 1;
  }
  .langs button[aria-pressed="true"] { background: #38bdf8; color: #0b1220; }
  input[type=file] { display: none; }
  input.field {
    flex: 1 1 140px; min-height: 48px; border-radius: 12px; border: 1px solid #334155;
    background: #0b1220; color: #e2e8f0; padding: 0 12px;
  }
  label.file {
    display: block; text-align: center; padding: 14px; border: 1px dashed #475569;
    border-radius: 12px; color: #cbd5e1; cursor: pointer;
  }
  .note { font-size: .8rem; color: #94a3b8; }
  .note.warn { color: #fca5a5; }
  .msg { border-radius: 12px; padding: 12px; font-weight: 600; display: none; }
  .msg.ok { display: block; background: #052e1a; color: #86efac; border: 1px solid #166534; }
  .msg.err { display: block; background: #3b0d0d; color: #fca5a5; border: 1px solid #7f1d1d; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #0b1220; color: #7dd3fc; font-size: .75rem; }
  .hidden { display: none !important; }
  /* The vendor credit, as on every other page this app serves. */
  .credit { margin: 0; padding: 0 16px 18px; text-align: center; font-size: .78rem; color: #64748b; }
</style>
</head>
<body>
<!--
  English in the file, re-read into the reader's language by ``capture.js`` off the
  ``data-t`` keys - the same contract as the punch page, and for the same reason: a script
  that does not arrive leaves English, not key names.
-->
<header>
  <div class="head">
    <h1 id="title" data-t="enroll.title">Register your face</h1>
    <p class="sub" id="who" data-t="enroll.sub">Checking your link…</p>
  </div>
  <nav class="langs" id="langs" data-t-aria="language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ar">ع</button>
    <button type="button" data-lang="hi">हि</button>
    <button type="button" data-lang="ur">UR</button>
  </nav>
</header>

<main>
  <div id="message" class="msg"></div>

  <div class="card" id="step-intro">
    <p class="note" data-t="enroll.intro">
      Stand in good light, hold the phone at eye level, and look straight at the camera.
      Remove hats or sunglasses. This photo is compared with the selfie you take when you
      clock in, so take it where you normally clock in.
    </p>
  </div>

  <div class="card">
    <video id="video" playsinline autoplay muted class="hidden"></video>
    <img id="preview" class="preview hidden" data-t-alt="camera.preview.photo" alt="Your photo preview" />
    <canvas id="canvas" class="hidden"></canvas>
    <div class="row" style="margin-top:12px">
      <button id="btn-start" data-t="camera.open">Open camera</button>
      <button id="btn-shoot" class="secondary hidden" data-t="camera.shoot.photo">Take photo</button>
      <button id="btn-retake" class="secondary hidden" data-t="camera.retake">Retake</button>
    </div>
    <!--
      The sentence is in a span of its own - see the same note on the punch page: a
      translation replaces an element's text, and doing that to the label would delete the
      file input this page needs when the camera is refused.
    -->
    <label class="file" id="fallback-label">
      <span data-t="enroll.fallback">Camera not available? Tap here to use the phone's gallery instead</span>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
    </label>
    <p class="note" id="photo-policy"></p>
    <p class="note warn hidden" id="photo-problem"></p>
  </div>

  <!--
    Only a *registration* link asks for this: it is the one link that creates the
    account, so its owner is the only person who may choose the password. On an
    enrollment link the account already exists and asking would be a way to guess at
    somebody else's.
  -->
  <div class="card hidden" id="password-card">
    <p class="note" id="password-hint" style="margin-top:0"></p>
    <div class="row" style="margin-top:10px">
      <input id="password" class="field" type="password" data-t-ph="enroll.password.placeholder"
             placeholder="Choose a password" autocomplete="new-password" />
      <input id="password2" class="field" type="password" data-t-ph="enroll.password2.placeholder"
             placeholder="Type it again" autocomplete="new-password" />
    </div>
  </div>

  <div class="card">
    <div class="row">
      <input id="phone" class="field" type="tel" data-t-ph="enroll.phone.placeholder"
             placeholder="Phone (optional)" inputmode="tel" />
      <input id="email" class="field" type="email" data-t-ph="enroll.email.placeholder"
             placeholder="Email (optional)" />
    </div>
    <button id="btn-submit" style="margin-top:12px;width:100%" data-t="enroll.submit" disabled>Submit my photo</button>
    <p class="note" id="status-line"></p>
  </div>
</main>

<footer class="credit" id="credit">Powered by دوامك اسهل</footer>

<!--
  Two scripts. This page is served at ``/enroll/<token>``, so a relative src asks the token
  route for... this page. See the longer note in quick.html - the same trap, the same
  one-level-up answer, and the same two files: the shared capture module, then this page's
  own flow.
-->
<script src="../capture.js"></script>
<script src="../enroll.js"></script>
</body>
</html>
