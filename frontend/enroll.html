<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#162F29" />
<title>Register your face — Site Attendance</title>
<!--
  The company's column in the tab and on the home screen. ``../`` because this page is
  served at ``/enroll/<token>``; see the note in quick.html for the whole trap.
-->
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon.svg">
<meta name="apple-mobile-web-app-title" content="Al-Jehad">
<style>
  /* The company's palette: the same seven values style.css hands the console's rail and
     the sign-in panel, written out here because these two pages load no stylesheet - a
     worker opens them from a link, often on site cellular, and the page has to paint on
     the first frame either way. The green is also what the phone paints its status bar
     with (``theme-color`` above), so the chrome and the page are one surface rather than
     a green bar over a grey page.

     Cream appears at reduced alpha below, for the quieter text and the hairlines, instead
     of being given tokens of its own to keep in step.

     The alphas are load-bearing, not decoration: each is set so that nothing on these two
     pages reads fainter than the slate palette it replaced. Quiet text is 0.74 (6.96:1
     before, 7.00:1 now), the footer credit 0.62 (which also lifts it out of the 3.75:1 it
     was already failing at), and the hairlines 0.16-0.32, every one of them at least as
     visible as the #334155 and #475569 edges they stand in for. */
  :root {
    --brand-green: #162F29;
    --brand-green-2: #1B3A32;
    --brand-green-ink: #102420;
    --brand-cream: #EDE7D6;
    --brand-gold: #DDC48C;
    --brand-gold-hi: #FBF0CB;
    --brand-gold-lo: #B9945A;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--brand-green); color: var(--brand-cream);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  /* The mark at the top left, where the console's rail keeps it, so the first thing on the
     page is the thing the worker tapped to get here. Decorative on purpose: the h1 beside
     it already says what the page is, and the column is also the tab icon. */
  .brand-mark { flex: 0 0 auto; margin-top: 2px; }
  .brand-mark img { display: block; width: 26px; height: auto; }
  /* ``env()`` is 0 in a browser tab and the notch's height in the installed app - which is
     the case that matters, because installed is the only mode that paints the status bar
     the colour set above, and then the notch sits over this padding. */
  header {
    padding: calc(18px + env(safe-area-inset-top, 0px)) 16px 10px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  header .head { flex: 1; min-width: 0; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .sub { color: rgba(237, 231, 214, 0.74); font-size: .85rem; margin: 0; }
  main { flex: 1; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--brand-green-2); border: 1px solid rgba(237, 231, 214, 0.16); border-radius: 14px; padding: 14px; }
  video, canvas, img.preview { width: 100%; border-radius: 12px; background: var(--brand-green-ink); display: block; }
  img.preview { aspect-ratio: 3/4; object-fit: cover; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-height: 52px; border: 1px solid transparent; border-radius: 12px; font-size: 1rem;
    font-weight: 600; color: var(--brand-green-ink); cursor: pointer;
    /* The gold of the lockup, at the same three stops the sign-in panel's button uses. */
    background: linear-gradient(180deg, var(--brand-gold-hi), var(--brand-gold) 52%, var(--brand-gold-lo));
  }
  button.secondary {
    background: rgba(237, 231, 214, 0.12); border-color: rgba(237, 231, 214, 0.26);
    color: var(--brand-cream);
  }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  /* The language picker, as on the punch page: sized like a control, not like the one
     thing the page is for. */
  .langs { display: flex; gap: 4px; flex: 0 0 auto; }
  .langs button {
    flex: 0 0 auto; min-height: 30px; min-width: 32px; padding: 0 7px; border-radius: 999px;
    background: rgba(237, 231, 214, 0.12); border-color: rgba(237, 231, 214, 0.26);
    color: var(--brand-cream); font-size: .75rem; font-weight: 700; line-height: 1;
  }
  .langs button[aria-pressed="true"] {
    background: linear-gradient(180deg, var(--brand-gold-hi), var(--brand-gold) 52%, var(--brand-gold-lo));
    border-color: transparent; color: var(--brand-green-ink);
  }
  input[type=file] { display: none; }
  /* The placeholder is this page's only label for the phone and the email - there is no
     visible one beside them - so it is set in the palette rather than left to the browser's
     default grey, which is chosen for a white page and all but disappears on this one. */
  input.field::placeholder { color: rgba(237, 231, 214, 0.65); }
  input.field {
    flex: 1 1 140px; min-height: 48px; border-radius: 12px;
    border: 1px solid rgba(237, 231, 214, 0.28);
    background: var(--brand-green-ink); color: var(--brand-cream); padding: 0 12px;
  }
  label.file {
    display: block; text-align: center; padding: 14px; border: 1px dashed rgba(237, 231, 214, 0.32);
    border-radius: 12px; color: var(--brand-cream); cursor: pointer;
  }
  .note { font-size: .8rem; color: rgba(237, 231, 214, 0.74); }
  .note.warn { color: #fca5a5; }
  .msg { border-radius: 12px; padding: 12px; font-weight: 600; display: none; }
  .msg.ok { display: block; background: rgba(22, 163, 74, 0.18); color: #86efac; border: 1px solid rgba(134, 239, 172, 0.4); }
  .msg.err { display: block; background: rgba(220, 38, 38, 0.18); color: #fca5a5; border: 1px solid rgba(252, 165, 165, 0.4); }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; background: var(--brand-green-ink); color: var(--brand-gold); font-size: .75rem; }
  .hidden { display: none !important; }
  /* The vendor credit, as on every other page this app serves. */
  .credit {
    margin: 0; padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: .78rem; color: rgba(237, 231, 214, 0.62);
  }
</style>
</head>
<body>
<!--
  English in the file, re-read into the reader's language by ``capture.js`` off the
  ``data-t`` keys - the same contract as the punch page, and for the same reason: a script
  that does not arrive leaves English, not key names.
-->
<header>
  <!--
    The company's mark. ``../`` for the reason the icon link and the scripts give - this page
    is served one segment deep under its token - and aria-hidden because the h1 beside it
    already names the page for a screen reader.
  -->
  <span class="brand-mark" aria-hidden="true"><img src="../logo-mark.svg" alt="" width="26" height="34"></span>
  <div class="head">
    <h1 id="title" data-t="enroll.title">Register your face</h1>
    <p class="sub" id="who" data-t="enroll.sub">Checking your link…</p>
  </div>
  <nav class="langs" id="langs" data-t-aria="language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ar">ع</button>
    <button type="button" data-lang="hi">हि</button>
    <button type="button" data-lang="ur">UR</button>
  </nav>
</header>

<main>
  <div id="message" class="msg"></div>

  <div class="card" id="step-intro">
    <p class="note" data-t="enroll.intro">
      Stand in good light, hold the phone at eye level, and look straight at the camera.
      Remove hats or sunglasses. This photo is compared with the selfie you take when you
      clock in, so take it where you normally clock in.
    </p>
  </div>

  <div class="card">
    <video id="video" playsinline autoplay muted class="hidden"></video>
    <img id="preview" class="preview hidden" data-t-alt="camera.preview.photo" alt="Your photo preview" />
    <canvas id="canvas" class="hidden"></canvas>
    <div class="row" style="margin-top:12px">
      <button id="btn-start" data-t="camera.open">Open camera</button>
      <button id="btn-shoot" class="secondary hidden" data-t="camera.shoot.photo">Take photo</button>
      <button id="btn-retake" class="secondary hidden" data-t="camera.retake">Retake</button>
    </div>
    <!--
      The sentence is in a span of its own - see the same note on the punch page: a
      translation replaces an element's text, and doing that to the label would delete the
      file input this page needs when the camera is refused.
    -->
    <label class="file" id="fallback-label">
      <span data-t="enroll.fallback">Camera not available? Tap here to use the phone's gallery instead</span>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
    </label>
    <p class="note" id="photo-policy"></p>
    <p class="note warn hidden" id="photo-problem"></p>
  </div>

  <!--
    Only a *registration* link asks for this: it is the one link that creates the
    account, so its owner is the only person who may choose the password. On an
    enrollment link the account already exists and asking would be a way to guess at
    somebody else's.
  -->
  <div class="card hidden" id="password-card">
    <p class="note" id="password-hint" style="margin-top:0"></p>
    <div class="row" style="margin-top:10px">
      <input id="password" class="field" type="password" data-t-ph="enroll.password.placeholder"
             placeholder="Choose a password" autocomplete="new-password" />
      <input id="password2" class="field" type="password" data-t-ph="enroll.password2.placeholder"
             placeholder="Type it again" autocomplete="new-password" />
    </div>
  </div>

  <div class="card">
    <div class="row">
      <input id="phone" class="field" type="tel" data-t-ph="enroll.phone.placeholder"
             placeholder="Phone (optional)" inputmode="tel" />
      <input id="email" class="field" type="email" data-t-ph="enroll.email.placeholder"
             placeholder="Email (optional)" />
    </div>
    <button id="btn-submit" style="margin-top:12px;width:100%" data-t="enroll.submit" disabled>Submit my photo</button>
    <p class="note" id="status-line"></p>
  </div>
</main>

<footer class="credit" id="credit">Powered by دوامك اسهل</footer>

<!--
  Two scripts. This page is served at ``/enroll/<token>``, so a relative src asks the token
  route for... this page. See the longer note in quick.html - the same trap, the same
  one-level-up answer, and the same two files: the shared capture module, then this page's
  own flow.
-->
<script src="../api-config.js"></script>
<script src="../capture.js"></script>
<script src="../enroll.js"></script>
</body>
</html>
