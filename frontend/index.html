<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover + no zoom is what makes it feel like a native app on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- The company's green, not generic blue: this is the colour the phone paints
         its status bar with, and it is the first thing the brand touches. -->
    <meta name="theme-color" content="#162F29">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Al-Jehad">
    <meta name="format-detection" content="telephone=no">
    <title>Al-Jehad - Site Attendance</title>
    <!--
      The company mark, not an emoji. icon.svg is a real file (the column on the
      company's green) so the browser has something to cache; without any icon it
      asked for /favicon.ico on every load and logged a 404 in a clean console.
      The apple-touch-icon is the same file, which iOS renders as a home-screen tile.
    -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">

    <!--
      Everything below uses RELATIVE paths on purpose. The page is served from the
      site root by backend/main.py, but it also has to work when the frontend
      folder is hosted on its own (VS Code Live Server, a static host, file://).
      Absolute "/static/..." paths 404 in those setups, which left a blank page.
    -->
    <script src="boot.js"></script>

    <!--
      One stylesheet, on this origin. It used to be three lines: the Tailwind CDN (which
      compiled the utility classes in the browser, on every load, on the connection this
      app is least able to assume), a script that apologised when that download failed,
      and style.css. The utilities are components in style.css now, so a phone with no
      internet gets the app it gets with one, and the policy no longer has to name a
      third-party script origin. netguard.py's CSP is the other half of that.
    -->
    <link rel="stylesheet" href="style.css">
    <noscript>
        <p style="font-family:system-ui,sans-serif;padding:20px">
            This app needs JavaScript. Please enable it in your browser settings.
        </p>
    </noscript>
</head>
<body>
    <div id="app"></div>
    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>

    <!--
      Four files, and only the four every session uses. Two more arrive later, on the
      session that actually needs them, so a worker's phone does not download them:

        admin_modules.js   255 KB, the console's eight screens. A worker can never reach
                           one - UI.renderApp sends a worker to the handset - so UI
                           injects this the first time an administrator signs in.
        i18n.ar.js         40 KB, i18n.hi.js 53 KB and i18n.ur.js, the translations a
                           reader who kept English will never read. I18n.load fetches
                           the one a reader asks for.

      Both are injected as a plain classic script tag pointing at the file, so the globals
      they declare (UI_MODULES, TRANSLATIONS) are the same bindings the eager tags created.
      backend/tests/test_frontend_payload.py is what keeps them out of this list.
    -->
    <script src="i18n.js"></script>
    <script src="frontendjavascript.js"></script>
    <script src="offline_queue.js"></script>
    <script src="worker_modules.js"></script>
</body>
</html>
