# The Worker that serves the frontend and proxies the backend.
#
# ``wrangler deploy`` from this directory uploads ``../../frontend`` as static assets and the
# Worker beside them, and publishes them at ``<name>.<account>.workers.dev``. See README.md in
# this folder for the address the backend answers on, the dashboard-only route, and what to set
# before the first request.
name = "al-jehad1"
main = "worker.mjs"
compatibility_date = "2026-09-01"

# The frontend, served from Cloudflare's edge. ``binding`` is the name the Worker reads as
# ``env.ASSETS``.
[assets]
directory = "../../frontend"
binding = "ASSETS"

# Belt and braces, and the reason it is explicit: the Worker routes the backend paths by
# itself (an allow-list inside worker.mjs), and this stops the asset layer from ever
# answering one of them with a file or a 404 first. A path list that is wrong in one place
# would otherwise be silently wrong in the other.
run_worker_first = ["/api/*", "/static/*", "/enroll/*", "/q/*"]

[vars]
# The backend's public https address, without a trailing slash.
#
# This is the Railway service, which is what makes the app a deployment rather than a laptop
# with a tunnel: the address does not change, so this line is written once. Point it at a tunnel
# (``python backend/serve.py --tunnel`` + ``cloudflared tunnel --url http://localhost:8000``)
# only while the host is down - a quick tunnel's trycloudflare.com address changes on every
# restart, and changing it means editing this file and redeploying the Worker.
#
# It has no default on purpose: with it empty every API call answers a 500 that names this
# variable, instead of the 404 that looks like the backend is broken.
API_ORIGIN = "https://al-jehad-production.up.railway.app"
