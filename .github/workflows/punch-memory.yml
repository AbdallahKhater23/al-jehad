# The 512 MB budget, enforced on every push instead of remembered.
#
# `backend/tools/punch_saturation.py` runs this application from the checkout with the
# deployment's own memory profile, drives eight simultaneous punches per round past its
# capacity of two for four rounds, and fails when the peak crossed `--ceiling-mib`. It is the
# fast half of the memory work: no docker, no cgroup, no cap - a prediction of the container's
# OOM rather than the kill itself. `backend/tools/capacity_test.py` is the other half, and it
# needs a docker daemon and several minutes of real inference: run it before a release, not on
# every push.
#
# Two things about the load, said here rather than discovered from a green tick:
#
#   * no face is committed to this repository (by design), so the punches send a frame with no
#     face in it. The upload policy, the spooled file, the decode, the detector and the queue
#     are all exercised; the embedding is skipped, and the report says so in its own note. Run
#     the tool by hand with `--selfie <a real face>` for the run whose numbers are the
#     deployment's, or point it at one on a private runner.
#   * the thresholds are the deployment's line, not this runner's: 400 MiB of resident set and
#     384 MiB of anonymous set against a 512 MiB instance with swap off. They were developed
#     against a Windows working set (203 MiB at rest, 284 MiB peak on the honouring run), which
#     counts file-backed pages as resident - a Linux runner's anonymous set is normally lower,
#     but if a runner's floor differs, these two flags are where that is adjusted, next to the
#     report the run uploads.

# A second job, `frame-decode-memory`, runs only when dispatched by hand. It answers a
# question about a *host* rather than a commit: whether the face frame's upright fast path
# (docs/FACE_VERIFICATION_MEMORY_REPORT.md, section 3) still avoids one full-resolution
# buffer once the allocator is the deployment's jemalloc under a 512 MB / 1 vCPU cgroup,
# rather than the Windows development box every figure in that report was taken on. So it is
# deliberately off the push path - it builds the deployment image, and that is worth a few
# minutes only when the answer is wanted.
#
# It measures twice, because the two disagree in a way that matters: once bare on the runner
# (Linux, glibc, uncapped) and once inside the built image (jemalloc, 512m/512m, --cpus 1 -
# exactly the flags tools/capacity_test.py applies). The tool fails the job only when the
# saving is genuinely absent (exit 1); an allocator that cannot expose the buffer at all is
# reported as inconclusive (exit 2) rather than read as a pass.
#
# A third hand-dispatched job, `face-process-memory`, answers a different host question: does
# moving the face models into a child process (FACE_ENGINE_PROCESS, face_process.py) really
# leave the API process without the ~150 MiB model floor? It runs tools/face_process_memory.py
# on the runner and inside the image, and it fails only when the parent still carries the floor
# or the child did not receive it. Like the decode job it is off the push path.

name: Punch memory budget

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      capped_container:
        description: >-
          Also build the deployment image and measure inside it at 512m / --cpus 1, where
          the allocator is the deployment's jemalloc rather than the runner's glibc.
        type: boolean
        default: true

concurrency:
  group: punch-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  punch-saturation:
    name: peak RSS under the ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Install the deployment's dependencies and the tooling
        run: pip install -r requirements.txt -r backend/requirements-dev.txt

      # The test suite into which the gate logic is collected clones the working database for
      # its schema and refuses to run without one (README, "Tests"): an empty file is enough,
      # a missing one is a failure. It is gitignored, so it has to be made here.
      - name: Give the suite its empty database
        run: touch times.db

      - name: The gate logic, with no server and no models
        working-directory: backend
        run: python -m pytest tests/test_punch_saturation_gates.py -q

      # The section 3 saving is invisible in the output (the frame is byte-identical either
      # way), so the only place it shows is memory - and the guard for it is portable
      # (`test_face_frame_chain.py` reads `resource.getrusage` here and the Windows counters
      # elsewhere). It used to run only on a development box; this is it running where it
      # ships, on the same Linux and the same allocator as the punch above.
      - name: The upright decode's peak, on Linux
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_face_frame_chain.py::test_an_upright_decode_does_not_pay_for_a_transpose_buffer
          -q

      - name: Saturate the punch endpoint and gate the peak RSS
        working-directory: backend
        run: |
          python tools/punch_saturation.py \
            --clients 8 --rounds 4 \
            --ceiling-mib 400 --anon-ceiling-mib 384 \
            --report punch-memory.json

      # Whatever the verdict: a red run whose numbers were thrown away is a red run somebody
      # has to reproduce by hand before they can believe it.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punch-memory-report
          path: backend/punch-memory.json
          if-no-files-found: warn

  # Does the section 3 saving exist on the deployment's own allocator, or only on the box it
  # was measured on? Two runs, and the second needs the answer from the first to be trusted:
  #
  #   * on the runner, `process_reader()` reads /proc (VmHWM), so the number is real Linux
  #     but glibc's allocator - the reason the comparison is a *rotated* photo rather than an
  #     absolute figure, and the same method the test suite's peak guard uses.
  #   * in the image, the allocator is the one the instance runs (jemalloc, LD_PRELOAD from
  #     the Dockerfile) and the ceiling is the one it runs under. A saving that survives here
  #     is the deployment's, not the development box's.
  #
  # Neither of these is a cgroup-level OOM gate - that is `tools/capacity_test.py`, and it
  # needs a real punch load. This asks one narrower question: is one full-resolution buffer
  # still being avoided when the frame is upright?
  frame-decode-memory:
    name: the upright decode saving, on Linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Install the deployment's dependencies and the tooling
        run: pip install -r requirements.txt -r backend/requirements-dev.txt

      # The runner first: fast, and it answers the same question one allocator earlier. Its
      # exit code is kept rather than consumed by `tee`, so a red run is red because the tool
      # said so rather than because the log survived.
      - name: The saving here, on this runner's glibc
        working-directory: backend
        run: |
          set -o pipefail
          code=0
          python tools/frame_decode_memory.py --json | tee /tmp/frame-decode-runner.txt || code=$?
          echo "runner exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::no upright saving measured on this Linux runner"
            exit 1
          fi

      # The test, not the tool that mirrors it: same comparison, same machine, and it fails
      # loudly rather than skipping when the allocator *can* expose the buffer and the saving
      # is gone. On this runner the allocator is glibc's, which is why it is paired with the
      # container run below.
      - name: The peak test here, on this runner's glibc
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_face_frame_chain.py::test_an_upright_decode_does_not_pay_for_a_transpose_buffer
          -q

      - name: Build the deployment image
        if: inputs.capped_container
        run: docker build -t frame-decode-memory .

      # `--memory-swap` equal to `--memory` is what turns "slower" into "killed", and the
      # Dockerfile's memory profile is restated for the same reason capacity_test.py restates
      # it. The entrypoint is replaced so this runs the tool and not the server - the question
      # is about a decode, and a serving process sharing the same 512 MB would answer it
      # wrongly in both directions.
      - name: The saving inside the image, at the instance's shape
        if: inputs.capped_container
        run: |
          set -o pipefail
          code=0
          docker run --rm --memory 512m --memory-swap 512m --cpus 1 --entrypoint python --workdir /app/backend --env FACE_INFERENCE_QUEUE=8 --env STANDING_SWEEP_ENABLED=0 frame-decode-memory tools/frame_decode_memory.py --json | tee /tmp/frame-decode-container.txt || code=$?
          echo "container exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::an upright decode costs what a rotated one does inside the deployment's own image"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::this allocator hid the buffer, so the answer is inconclusive rather than absent"
          fi

      # And the test itself at the instance's shape: jemalloc, 512 MB with swap off, one core.
      # The image is the runtime manifest only (pytest is deliberately not in it), so pytest
      # is installed into the throwaway container rather than the image; everything else the
      # test imports - numpy, Pillow, FastAPI, the application - is already there. A test that
      # skips here is a `::warning`, because an allocator that cannot show the buffer is an
      # inconclusive answer, not a pass; a failure is a failure.
      - name: The peak test inside the image, at the instance's shape
        if: inputs.capped_container
        run: |
          set -o pipefail
          code=0
          docker run --rm --memory 512m --memory-swap 512m --cpus 1 --entrypoint sh --env FACE_INFERENCE_QUEUE=8 --env STANDING_SWEEP_ENABLED=0 frame-decode-memory -c "pip install --quiet pytest==9.1.1 && cd backend && python -m pytest tests/test_face_frame_chain.py::test_an_upright_decode_does_not_pay_for_a_transpose_buffer -q" | tee /tmp/frame-decode-test-container.txt || code=$?
          echo "container test exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            if grep -q "1 skipped" /tmp/frame-decode-test-container.txt; then
              echo "::warning::the peak test skipped inside the image (this allocator hid the buffer)"
            else
              echo "::error::the peak test failed inside the deployment's own image"
              exit 1
            fi
          fi

      - name: Keep both reports, whatever the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-decode-memory
          path: |
            /tmp/frame-decode-runner.txt
            /tmp/frame-decode-container.txt
            /tmp/frame-decode-test-container.txt
          if-no-files-found: warn

  # Does the model floor actually leave the API process on Linux? `tools/face_process_memory.py`
  # measures the same preload-plus-detector work twice - flag off, then flag on - and reports
  # the API process's floor on each side plus the child that received the work. It fails the
  # job only when the parent still carries the floor (exit 1) or the child is empty (exit 1); a
  # host that cannot expose a floor-sized buffer is inconclusive (exit 2), never a pass.
  face-process-memory:
    name: the model floor, in a child
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-dev.txt

      - name: Install the deployment's dependencies and the tooling
        run: pip install -r requirements.txt -r backend/requirements-dev.txt

      - name: The floor here, on this runner
        working-directory: backend
        run: |
          set -o pipefail
          code=0
          python tools/face_process_memory.py --json | tee /tmp/face-process-runner.txt || code=$?
          echo "runner exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::the API process still carries the model floor on this runner"
            exit 1
          fi

      - name: Build the deployment image
        if: inputs.capped_container
        run: docker build -t face-process-memory .

      # Same 512m / --cpus 1 shape the other jobs use, with the entrypoint replaced so this runs
      # the tool rather than the server. The tool spawns the model child itself, so the flag
      # under test is the tool's, not the container's.
      - name: The floor inside the image, at the instance's shape
        if: inputs.capped_container
        run: |
          set -o pipefail
          code=0
          docker run --rm --memory 512m --memory-swap 512m --cpus 1 --entrypoint python --workdir /app/backend --env FACE_INFERENCE_QUEUE=8 --env STANDING_SWEEP_ENABLED=0 face-process-memory tools/face_process_memory.py --json | tee /tmp/face-process-container.txt || code=$?
          echo "container exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::the API process still carries the model floor inside the deployment's own image"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::this host could not expose a floor-sized buffer, so the answer is inconclusive rather than absent"
          fi

      - name: Keep both reports, whatever the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-process-memory
          path: |
            /tmp/face-process-runner.txt
            /tmp/face-process-container.txt
          if-no-files-found: warn
